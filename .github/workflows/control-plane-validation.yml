name: Control Plane Validation
on:
  push:
    branches: [main, phase-1/control-plane]
  pull_request:
    branches: [main]
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1','8.2','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - name: Lint PHP
        run: |
          set -e
          find wordpress/master-control-plane/goi-master-connector -name '*.php' -print0 | xargs -0 -n1 php -l
          find wordpress/goi-core -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify forbidden execution APIs are absent from connector
        run: |
          ! grep -RInE 'shell_exec|exec\(|system\(|passthru\(|proc_open|popen\(' wordpress/master-control-plane/goi-master-connector
      - name: Verify secrets are not committed
        run: |
          ! grep -RInE 'X-GOI-Secret|GOI_SECRET|ghp_[A-Za-z0-9]+' wordpress/master-control-plane/goi-master-connector --exclude='*.md'
