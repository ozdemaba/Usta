name: GOI Release
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Release tag, e.g. v0.2.0
        required: true
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    env:
      RELEASE_ID: ${{ github.event.inputs.release_id || github.ref_name }}
      GOI_RELEASE_PRIVATE_KEY: ${{ secrets.GOI_RELEASE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP
        run: |
          find wordpress/goi-core -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Build signed release
        run: php deployment/build-release.php
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_ID" dist/* --title "$RELEASE_ID" --generate-notes
